name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-36 build-tools;36.0.0' }
      - run: npm ci
      - run: npm test
      - name: Build web app
        env:
          # Repo secret/variable: your deployed backend, e.g. https://cymor-todo-api.onrender.com
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::Set VITE_API_URL (Settings > Secrets and variables > Actions)"; exit 1; }
          npm run build
      - name: Add Firebase config (optional, enables server push)
        env: { GS_JSON: '${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}' }
        run: |
          if [ -n "$GS_JSON" ]; then echo "$GS_JSON" | base64 -d > android/app/google-services.json; echo "Firebase config added"; else echo "No GOOGLE_SERVICES_JSON_BASE64: building with local notifications only"; fi
      - name: Sync Capacitor
        run: npx cap sync android --verbose || npx cap sync android
      - name: Build debug APK
        working-directory: frontend/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CYMOR-TO-DO-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
