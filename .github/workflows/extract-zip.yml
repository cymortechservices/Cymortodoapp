name: Extract zip

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Zip file in the repo root"
        default: "CYMOR-TO-DO-V1.1.zip"
      delete_zip:
        description: "Delete the zip after extracting"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract
        run: |
          set -e
          test -f "${{ inputs.zip_name }}" || { echo "::error::${{ inputs.zip_name }} not found in repo root"; exit 1; }
          rm -rf /tmp/x && mkdir /tmp/x
          unzip -q "${{ inputs.zip_name }}" -d /tmp/x
          # The zip has one top folder (cymor-to-do/). Copy its contents into the repo root.
          # .github is skipped: GitHub blocks workflow-file changes made with the default token.
          rsync -a --exclude '.github' /tmp/x/cymor-to-do/ ./
          # Keep the new workflows aside so you can add them by hand (see below)
          mkdir -p _workflows_to_add && cp /tmp/x/cymor-to-do/.github/workflows/*.yml _workflows_to_add/
          if [ "${{ inputs.delete_zip }}" = "true" ]; then git rm -q "${{ inputs.zip_name }}"; fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "Add CYMOR TO-DO V1.1 from zip"
          git push
